name: Debug SDK

on:
  workflow_dispatch:
    inputs:
      sdk:
        description: "SDK tag suffix"
        required: true
        default: "SNAPSHOT"

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect image layout
        run: |
          docker run --rm --entrypoint bash "ghcr.io/openwrt/sdk:x86_64-${{ inputs.sdk }}" -c '
            echo "=== /entry.sh ==="; cat /entry.sh 2>/dev/null || echo "(none)"
            echo "=== /start.sh ==="; cat /start.sh 2>/dev/null || echo "(none)"
            echo "=== ls -la /builder ==="; ls -la /builder | head
            echo "=== find feeds.conf (any depth) ==="
            find / -name "feeds.conf*" 2>/dev/null | head
            echo "=== find scripts/feeds ==="
            find / -maxdepth 6 -path "*/scripts/feeds" 2>/dev/null | head
          '
