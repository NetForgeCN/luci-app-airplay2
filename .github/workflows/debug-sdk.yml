name: Debug SDK

on:
  workflow_dispatch:
    inputs:
      sdk:
        description: "SDK tag suffix"
        required: true
        default: "SNAPSHOT"
      compile:
        description: "Also try compiling airplay2 (1 = yes)"
        required: true
        default: "1"

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/openwrt-master

      - name: Verify kconfig and build
        run: |
          docker run --rm --entrypoint bash -v "$PWD:/feed" \
            "ghcr.io/openwrt/sdk:x86_64-${{ inputs.sdk }}" -c '
              set -e
              cd /builder
              [ ! -f setup.sh ] || bash setup.sh
              SDK=$(dirname $(find /builder -maxdepth 5 -path "*/scripts/feeds" -printf "%h\n" | head -1))
              echo "SDK ROOT: $SDK"
              cd "$SDK"

              sed -e "s,https://git.openwrt.org/feed/,https://github.com/openwrt/," \
                  -e "s,https://git.openwrt.org/openwrt/,https://github.com/openwrt/," \
                  -e "s,https://git.openwrt.org/project/,https://github.com/openwrt/," \
                  feeds.conf.default > feeds.conf
              echo "src-link packages_ci /feed/" >> feeds.conf

              ./scripts/feeds update -a >/tmp/upd.log 2>&1 || tail -20 /tmp/upd.log
              ./scripts/feeds install -p packages_ci -f airplay2 nqptp luci-app-airplay2

              echo "############ defconfig ############"
              make defconfig 2>&1 | tee /tmp/def.log | grep -iE "airplay2|libffmpeg|audio-support|video-support" | head -30 || true
              echo "############ kconfig entries ############"
              grep -c "PACKAGE_airplay2$" tmp/.config-package.in || echo "airplay2 MISSING"
              grep -c "PACKAGE_luci-app-airplay2$" tmp/.config-package.in || echo "luci MISSING"
              echo "---- airplay2 block ----"
              awk "/^config PACKAGE_airplay2\$/{f=1} f{print} f&&/^\$/{exit}" tmp/.config-package.in
              echo "############ force select ############"
              printf "CONFIG_PACKAGE_airplay2=y\nCONFIG_PACKAGE_luci-app-airplay2=y\nCONFIG_PACKAGE_nqptp=y\n" >> .config
              make defconfig >/dev/null 2>&1 || true
              grep -E "^CONFIG_PACKAGE_(airplay2|luci-app-airplay2|nqptp)=" .config || echo "(still not selected)"

              if [ "${{ inputs.compile }}" = "1" ]; then
                echo "############ compile airplay2 ############"
                timeout 900 make package/airplay2/compile V=s -j$(nproc) 2>&1 | tail -40 || echo "COMPILE TIMEOUT/FAIL rc=$?"
                echo "############ artifacts ############"
                find bin/packages -path "*packages_ci*" \( -name "*.apk" -o -name "*.ipk" \) -printf "%f\n" || echo "(none)"
              fi
            '
