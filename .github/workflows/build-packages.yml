name: Build packages

on:
  push:
    tags:
      - v*
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.arch }} / ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    permissions:
      # needed by ncipollo/release-action when publishing a release on tags
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64_generic
            sdk: openwrt-24.10
            publish: true
          - arch: x86_64
            sdk: openwrt-24.10
            publish: true
          # Development-tree build: proves the packages still compile against
          # OpenWrt master (SDK tag "SNAPSHOT"). Never published to a release.
          - arch: x86_64
            sdk: SNAPSHOT
            publish: false

    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Building packages
        uses: sbwml/openwrt-gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.sdk }}
          FEEDNAME: packages_ci
          PACKAGES: luci-app-airplay2 nqptp
          NO_REFRESH_CHECK: true
          # keep compiler/configure error output visible (the default discards
          # stdout *and* stderr, which hides the reason a build failed)
          V: s

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}-${{ matrix.sdk }}
          path: bin/packages/${{ matrix.arch }}/packages_ci/*.ipk

      - name: Upload packages
        if: startsWith(github.ref, 'refs/tags/') && matrix.publish
        uses: ncipollo/release-action@v1
        with:
          name: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: true
          artifacts: "bin/packages/${{ matrix.arch }}/packages_ci/*.ipk"
