name: Build packages

on:
  push:
    tags:
      - v*
  pull_request:
  workflow_dispatch:
    inputs:
      arch:
        description: "Limit to one architecture (empty = all)"
        required: false
        default: ""

jobs:
  build:
    name: ${{ matrix.arch }} / ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      # needed by ncipollo/release-action when publishing a release on tags
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # OpenWrt master (snapshot SDK). This is the primary target: the
          # packages follow the current development tree.
          - arch: x86_64
            sdk: SNAPSHOT
            publish: true
          - arch: aarch64_generic
            sdk: SNAPSHOT
            publish: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build in SDK container
        run: |
          mkdir -p out && chmod 777 out
          docker run --rm --entrypoint bash \
            -v "$PWD:/feed" \
            -v "$PWD/out:/out" \
            -e "ARCH=${{ matrix.arch }}" \
            "ghcr.io/openwrt/sdk:${{ matrix.arch }}-${{ matrix.sdk }}" -c '
              set -eo pipefail
              mkdir -p /out

              # snapshot images ship without the SDK to save bandwidth
              cd /builder
              [ ! -f setup.sh ] || bash setup.sh
              SDK=$(dirname $(find /builder -maxdepth 5 -path "*/scripts/feeds" -printf "%h\n" | head -1))
              echo "SDK root: $SDK"
              cd "$SDK"

              # use the GitHub mirrors, same as the upstream CI does
              sed -e "s,https://git.openwrt.org/feed/,https://github.com/openwrt/," \
                  -e "s,https://git.openwrt.org/openwrt/,https://github.com/openwrt/," \
                  -e "s,https://git.openwrt.org/project/,https://github.com/openwrt/," \
                  feeds.conf.default > feeds.conf
              echo "src-link packages_ci /feed/" >> feeds.conf

              ./scripts/feeds update -a
              ./scripts/feeds install -p packages_ci -f airplay2 nqptp luci-app-airplay2

              make defconfig

              # select what we ship (feeds install does not touch .config)
              sed -i -E "/^CONFIG_PACKAGE_(airplay2|nqptp|luci-app-airplay2|luci-i18n-airplay2-zh-cn)[= ]/d" .config
              printf "CONFIG_PACKAGE_airplay2=y\nCONFIG_PACKAGE_nqptp=y\nCONFIG_PACKAGE_luci-app-airplay2=y\nCONFIG_PACKAGE_luci-i18n-airplay2-zh-cn=y\n" >> .config
              make defconfig

              echo "=== selected packages ==="
              grep -E "^CONFIG_PACKAGE_(airplay2|nqptp|luci-app-airplay2)=" .config

              echo "=== build ==="
              make package/airplay2/compile package/nqptp/compile \
                   package/luci-app-airplay2/compile V=s -j$(nproc)

              echo "=== artifacts ==="
              # 两个架构编出来的包同名（airplay2-5.6.3-r1.apk），直接把 /out 一起传上去
              # 会让后一个上传的覆盖前一个（replacesArtifacts），Release 里就只剩一个架构、
              # 而且看不出是哪个。所以架构相关的包加 _<arch> 后缀；luci-* 与架构无关，保持原名。
              while IFS= read -r f; do
                base="$(basename "$f")"; ext="${base##*.}"; stem="${base%.*}"
                case "$base" in
                  luci-*) cp -v "$f" "/out/$base" ;;
                  *)      cp -v "$f" "/out/${stem}_${ARCH}.${ext}" ;;
                esac
              done < <(find bin/packages -path "*packages_ci*" \( -name "*.apk" -o -name "*.ipk" \) -type f)
              ls -la /out
            '

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}-${{ matrix.sdk }}
          path: out/*
          if-no-files-found: error

      - name: Upload packages
        if: startsWith(github.ref, 'refs/tags/') && matrix.publish
        uses: ncipollo/release-action@v1
        with:
          name: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: true
          artifacts: "out/*"
          # A tag push fills in nothing by itself: the annotated tag message lives
          # in the tag object and never reaches the release, so v5.1.1 published
          # with an empty body. Build the notes from the commits since the
          # previous tag instead.
          generateReleaseNotes: true
